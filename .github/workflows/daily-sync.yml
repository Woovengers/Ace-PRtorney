name: Daily DB Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKENS: ${{ secrets.GH_TOKENS }}
      DATABASE_POOLER_URL: ${{ secrets.DATABASE_POOLER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync database from GitHub
        run: npm run db:sync

      - name: Rebuild database summaries
        run: npm run db:build-summaries
